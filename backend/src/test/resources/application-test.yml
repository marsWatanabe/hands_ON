spring:
  datasource:
    # A fresh in-memory DB per Spring context so tests do not see each other's rows.
    url: jdbc:h2:mem:inventrack-test-${random.uuid};DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: false
  flyway:
    # Tests use the schema and the minimal seed (3 centers) only; seed-demo (22 centers) is for manual checks.
    locations: classpath:db/migration,classpath:db/seed-dev
