name: "Copilot Setup Steps"

# Copilot コーディングエージェントが作業を始める前に実行される環境の準備。
# ジョブ名は必ず `copilot-setup-steps` にする（変えるとエージェントに使われない）。
# この YAML を変更したときは、Actions タブでこのワークフローを手動実行して、成功することを確認する。
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Download Maven dependencies and compile
        working-directory: backend
        run: ./mvnw -B -q -DskipTests test-compile
